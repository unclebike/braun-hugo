baseURL = 'https://unclebike.xyz/'
languageCode = 'en-us'
title = 'Uncle Bike'
theme = 'braun-hugo'

# Output formats
[outputs]
  home = ["HTML", "JSON"]

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Menu: defined in page frontmatter so drafts auto-hide from nav
# Only "Home" stays here since it has no content file
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

# Image processing
[imaging]
  quality = 75
  resampleFilter = "lanczos"

# Related content
[related]
  threshold = 80
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100

# Taxonomies
[taxonomies]
  tag = "tags"
  author = "authors"

# Permalinks - pages/projects/benefits at root level to match Ghost URLs
[permalinks]
  pages = "/:filename/"
  projects = "/:filename/"
  benefits = "/:filename/"
  services = "/:filename/"
  posts = "/:filename/"

# Params - Theme Settings (from Ghost package.json config.custom)
[params]
  description = "Uncle Bike"
  author = "Adam Tilley"
  logo = "/images/ghost/uncle_logo-1.svg"
  
  # Core settings
  edit_mode = false
  color_combinations = "Default"
  appearance = "user"
  tagline_text = "Your Local Bike Guy."
  show_navigation_icons = true
  navigation_buttons = "Subscription"
  navigation_buttons_text = "Book Online"
  navigation_buttons_link = "#book"
  
  # Homepage settings
  hero_layout = "Rectangle image top"
  case_study_card_style = "Full row"
  blog_article_layout = "Card"
  blog_image_orientation = "Landscape"
  blog_category_navigation = ""
  excluded_tags = "books,now,hash-timeline,hash-gallery"
  email_signup_text = "Subscribe to my monthly newsletter"
  
  # GOATkit booking widget
  goatkit_url = "https://api.unclebike.xyz/widget/demo"

  # Brand color — keep in sync with the admin app's primaryColor (branding.js
  # also sets this at runtime, but this value is the anti-flash default before
  # the API script runs).
  brand_color = "#ff5757"

  # Paused mode — Uncle Bike is out delivering the Tyendinaga wayfinding project.
  # Flip to false when bookings reopen; every sticker, modal, and CTA intercept
  # is driven by this flag.
  paused_mode = true
  paused_project_title = "Tyendinaga Township Cycling Wayfinding"
  paused_project_url = "/currently/"
  paused_phone_intl = "+16132874543"
  paused_phone_display = "613-287-4543"
  paused_funder_line = "Funded by the Ontario Trillium Foundation. Delivered by Explore Hastings County in partnership with Tyendinaga Township."
  
  # Post settings
  show_author = false
  show_social_share = false
  show_subscription_box = false
  
  # Pagination
  posts_per_page = 18
